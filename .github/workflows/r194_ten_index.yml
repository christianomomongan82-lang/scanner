name: R194 Ten-Index Locked Baseline

on:
  push:
    branches: [main]
    paths:
      - "research/r194_ten_index.py"
      - ".github/workflows/r194_ten_index.yml"
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

concurrency:
  group: r194-ten-index-universe
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore persistent historical-data cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: dl
          key: r194-ten-index-data-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            r194-ten-index-data-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python and compile
        run: |
          python -m pip install --upgrade pip pandas numpy requests
          python -m py_compile scan.py research/r192_ger40.py research/r194_ten_index.py
          mkdir -p dl results

      - name: Regression check corrected H4 boundaries against live scanner
        run: |
          python - <<'PY'
          import numpy as np
          import pandas as pd
          import scan
          from research.r192_ger40 import build_h4
          spans = [
              pd.date_range("2025-03-07", "2025-03-12", freq="h", tz="UTC"),
              pd.date_range("2025-10-31", "2025-11-05", freq="h", tz="UTC"),
          ]
          idx = spans[0].append(spans[1]).unique().sort_values()
          v = np.arange(len(idx), dtype=float) + 10000
          h1 = pd.DataFrame({"open":v,"high":v+1,"low":v-1,"close":v+0.25},index=idx)
          a = scan.to_h4(h1)
          b, _ = build_h4(h1, pd.Timestamp("2026-01-01",tz="UTC"))
          assert a.index.equals(b.index), "H4 index mismatch between live scanner and baseline engine"
          for c in ("open","high","low","close"):
              assert np.allclose(a[c].to_numpy(), b[c].to_numpy()), f"H4 OHLC mismatch: {c}"
          assert set(a.index.hour).issubset({1,5,9,13,17,21}), "unexpected NY H4 boundary"
          spring = a.loc[(a.index.strftime("%Y-%m-%d")=="2025-03-09") & (a.index.hour==1)]
          fall = a.loc[(a.index.strftime("%Y-%m-%d")=="2025-11-02") & (a.index.hour==1)]
          assert len(spring)==1 and float((spring.bar_close_utc.iloc[0]-spring.index[0].tz_convert("UTC"))/pd.Timedelta(hours=1))==3
          assert len(fall)==1 and float((fall.bar_close_utc.iloc[0]-fall.index[0].tz_convert("UTC"))/pd.Timedelta(hours=1))==5
          print("PASS: live scanner and research engine match exactly; DST transition intervals are 3h/5h.")
          PY

      - name: Download only missing instrument datasets, then compress
        id: download
        env:
          NODE_OPTIONS: --require=./dukascopy_fetch_patch.cjs
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p dl
          CHANGED=false
          FAILURES=()
          INSTRUMENTS=(
            usa500idxusd
            usatechidxusd
            usa30idxusd
            ussc2000idxusd
            deuidxeur
            gbridxgbp
            fraidxeur
            eusidxeur
            ausidxaud
            jpnidxjpy
          )
          for INST in "${INSTRUMENTS[@]}"; do
            for TF in h1 m5; do
              CACHE="dl/${INST}_${TF}.csv.gz"
              RAW="dl/${INST}_${TF}.csv"
              if [ -s "$CACHE" ] && gzip -t "$CACHE" >/dev/null 2>&1; then
                echo "CACHE HIT: $INST $TF; using saved Dukascopy snapshot."
                continue
              fi

              rm -f "$RAW" "$CACHE"
              if [ "$TF" = "h1" ]; then
                BS=3
                BP=2000
                RP=5000
              else
                BS=10
                BP=1000
                RP=1000
              fi

              OK=false
              for ATTEMPT in 1 2 3; do
                echo "DOWNLOAD $INST $TF (attempt $ATTEMPT/3), 2016-01-01 to now"
                rm -f "$RAW"
                if npx --yes dukascopy-node \
                  -i "$INST" -from "2016-01-01" -to "now" \
                  -t "$TF" -p bid -utc 0 -f csv -fl \
                  -dir dl -fn "${INST}_${TF}" \
                  -bs "$BS" -bp "$BP" -r 5 -re -rp "$RP"; then
                  LINES=$(wc -l < "$RAW" 2>/dev/null || echo 0)
                  if [ -s "$RAW" ] && [ "$LINES" -gt 1000 ]; then
                    if gzip -1 "$RAW" && gzip -t "$CACHE"; then
                      echo "SAVED $CACHE ($(du -h "$CACHE" | cut -f1), rows=$((LINES - 1)))"
                      CHANGED=true
                      OK=true
                      break
                    fi
                  fi
                fi
                echo "WARN: download/validation failed for $INST $TF attempt $ATTEMPT"
                sleep $((ATTEMPT * 5))
              done
              if [ "$OK" != "true" ]; then
                echo "ERROR: could not prepare $INST $TF after 3 attempts"
                FAILURES+=("$INST/$TF")
              fi
            done
          done
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          if [ "${#FAILURES[@]}" -gt 0 ]; then
            printf 'Incomplete datasets: %s\n' "${FAILURES[*]}"
            exit 1
          fi

      - name: Save new data to persistent cache, even if later analysis fails
        if: always() && steps.download.outputs.changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: dl
          key: r194-ten-index-data-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Validate all cached source data and report coverage
        run: |
          python - <<'PY'
          from pathlib import Path
          from research.r192_ger40 import parse_data
          assets = {
              "usa500idxusd":"USA 500 / S&P 500",
              "usatechidxusd":"USA 100 Tech / Nasdaq 100",
              "usa30idxusd":"USA 30 / Dow Jones",
              "ussc2000idxusd":"US Small Cap 2000",
              "deuidxeur":"Germany 40 / DAX",
              "gbridxgbp":"FTSE 100",
              "fraidxeur":"France 40 / CAC 40",
              "eusidxeur":"EU Stocks 50",
              "ausidxaud":"Australia 200",
              "jpnidxjpy":"Japan 200+",
          }
          failed = []
          for inst, name in assets.items():
              for tf in ("h1","m5"):
                  p = Path("dl") / f"{inst}_{tf}.csv.gz"
                  try:
                      bars, duplicates = parse_data(p)
                      print(f"COVERAGE {inst} {tf.upper()}: rows={len(bars):,}; duplicates_removed={duplicates}; UTC={bars.index[0].tz_convert('UTC').isoformat()}..{bars.index[-1].tz_convert('UTC').isoformat()}")
                  except Exception as exc:
                      failed.append(f"{inst} {tf}: {type(exc).__name__}: {exc}")
          if failed:
              raise SystemExit("Invalid cache datasets:\n" + "\n".join(failed))
          print(f"PASS: validated H1 and M5 source data for all {len(assets)} instruments.")
          PY

      - name: Run locked R191 baseline across ten instruments
        run: |
          python -u research/r194_ten_index.py --data-dir dl --out results

      - name: Upload R194 audit outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R194-ten-index-audit
          path: results/
          if-no-files-found: warn
          retention-days: 90
