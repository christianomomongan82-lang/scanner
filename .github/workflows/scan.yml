name: scan
on:
  schedule:
    - cron: "3 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
permissions:
  issues: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas requests
      - name: Diagnose Dukascopy API status
        run: |
          node --input-type=module <<'NODE'
          const now = new Date();
          const year = now.getUTCFullYear();
          const month = now.getUTCMonth() + 1;
          const monthStart = Date.UTC(year, now.getUTCMonth(), 1);
          const prevMonth = month === 1 ? 12 : month - 1;
          const prevYear = month === 1 ? year - 1 : year;
          const symbols = ["USA500.IDX-USD", "USATECH.IDX-USD"];
          const urls = [];
          for (const symbol of symbols) {
            urls.push(`https://jetta.dukascopy.com/v1/candles/hour/${symbol}/BID/${prevYear}/${prevMonth}`);
            urls.push(`https://jetta.dukascopy.com/v1/candles/hour/${symbol}/BID?from=${monthStart}`);
          }
          for (const symbol of ["USA500IDXUSD", "USATECHIDXUSD"]) {
            urls.push(`https://datafeed.dukascopy.com/datafeed/${symbol}/${prevYear}/${String(prevMonth).padStart(2, "0")}/BID_candles_hour_1.bi5`);
          }
          for (const url of urls) {
            try {
              const response = await fetch(url);
              const bytes = new Uint8Array(await response.arrayBuffer());
              const preview = new TextDecoder().decode(bytes.slice(0, 160)).replace(/\\s+/g, " ");
              console.log("DIAG_STATUS", response.status, "BYTES", bytes.length, "URL", url);
              console.log("DIAG_BODY", preview);
            } catch (error) {
              console.log("DIAG_ERROR", url, String(error));
            }
          }
          NODE
      - run: python scan.py
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
