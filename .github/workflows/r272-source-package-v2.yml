name: R272 locked source transfer v2 (no computation)

on:
  push:
    branches:
      - local-backtest/r189-dukascopy-history
    paths:
      - ".github/workflows/r272-source-package-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-reviewed-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: local-backtest/r189-dukascopy-history
          persist-credentials: false
      - name: Copy source and preregistration without execution
        run: |
          mkdir -p package/research
          cp research/r272_xauusd_dual_module.py package/research/
          cp research/R272_XAUUSD_DUAL_MODULE_PREREGISTRATION.md package/research/
          cp research/FUNDEDNEXT_STELLAR2_RULES_VERIFIED_20261016.md package/research/
          cp research/FUNDED_READINESS_GATE_20261016.md package/research/
          cp PROJECT_STATE.md package/
      - uses: actions/upload-artifact@v4
        with:
          name: R272-source-transfer-v2
          path: package/
          retention-days: 14
