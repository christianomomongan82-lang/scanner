name: R193 R191 Baseline Revalidation

on:
  push:
    branches: [main]
    paths:
      - "research/r193_r191_baseline.py"
      - ".github/workflows/r193_r191_baseline.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r193-r191-baseline
  cancel-in-progress: false

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies and compile
        run: |
          python -m pip install --upgrade pip pandas numpy requests
          python -m py_compile scan.py research/r192_ger40.py research/r193_r191_baseline.py
          mkdir -p dl results

      - name: Regression check corrected H4 boundaries against live scanner
        run: |
          python - <<'PY'
          import numpy as np
          import pandas as pd
          import scan
          from research.r192_ger40 import build_h4
          spans = [
              pd.date_range("2025-03-07", "2025-03-12", freq="h", tz="UTC"),
              pd.date_range("2025-10-31", "2025-11-05", freq="h", tz="UTC"),
          ]
          idx = spans[0].append(spans[1]).unique().sort_values()
          v = np.arange(len(idx), dtype=float) + 10000
          h1 = pd.DataFrame({"open":v,"high":v+1,"low":v-1,"close":v+0.25},index=idx)
          a = scan.to_h4(h1)
          b, _ = build_h4(h1, pd.Timestamp("2026-01-01",tz="UTC"))
          assert a.index.equals(b.index), "H4 index mismatch between live scanner and baseline engine"
          for c in ("open","high","low","close"):
              assert np.allclose(a[c].to_numpy(), b[c].to_numpy()), f"H4 OHLC mismatch: {c}"
          assert set(a.index.hour).issubset({1,5,9,13,17,21}), "unexpected NY H4 boundary"
          spring = a.loc[(a.index.strftime("%Y-%m-%d")=="2025-03-09") & (a.index.hour==1)]
          fall = a.loc[(a.index.strftime("%Y-%m-%d")=="2025-11-02") & (a.index.hour==1)]
          assert len(spring)==1 and float((spring.bar_close_utc.iloc[0]-spring.index[0].tz_convert("UTC"))/pd.Timedelta(hours=1))==3
          assert len(fall)==1 and float((fall.bar_close_utc.iloc[0]-fall.index[0].tz_convert("UTC"))/pd.Timedelta(hours=1))==5
          print("PASS: live scanner and research engine match exactly; DST transition intervals are 3h/5h.")
          PY

      - name: Download H1 BID and M5 BID for USA500 and USATECH, annual chunks
        env:
          NODE_OPTIONS: --require=./dukascopy_fetch_patch.cjs
        shell: bash
        run: |
          set -u
          for INST in usa500idxusd usatechidxusd; do
            for YEAR in $(seq 2016 2026); do
              NEXT=$((YEAR + 1))
              FROM="${YEAR}-01-01"
              if [ "$YEAR" -eq 2026 ]; then TO="now"; else TO="${NEXT}-01-01"; fi

              H1="dl/${INST}_h1_${YEAR}.csv"
              echo "H1 BID download: $INST $YEAR to $TO"
              rm -f "$H1"
              if ! npx --yes dukascopy-node \
                -i "$INST" -from "$FROM" -to "$TO" \
                -t h1 -p bid -utc 0 -f csv -fl \
                -dir dl -fn "${INST}_h1_${YEAR}" \
                -bs 3 -bp 2000 -r 5 -re -rp 5000; then
                echo "ERROR: H1 download failed for $INST $YEAR"
                exit 1
              fi
              if [ ! -s "$H1" ] || [ "$(wc -l < "$H1")" -le 1 ]; then
                echo "ERROR: H1 file missing/empty for $INST $YEAR"
                exit 1
              fi
              echo "H1 rows $INST $YEAR: $(($(wc -l < "$H1") - 1))"

              M5="dl/${INST}_m5_${YEAR}.csv"
              echo "M5 BID download: $INST $YEAR to $TO"
              rm -f "$M5"
              if npx --yes dukascopy-node \
                -i "$INST" -from "$FROM" -to "$TO" \
                -t m5 -p bid -utc 0 -f csv -fl \
                -dir dl -fn "${INST}_m5_${YEAR}" \
                -bs 10 -bp 1000 -r 5 -rp 1000; then
                if [ -s "$M5" ] && [ "$(wc -l < "$M5")" -gt 1 ]; then
                  echo "M5 rows $INST $YEAR: $(($(wc -l < "$M5") - 1))"
                else
                  echo "M5 NO DATA $INST $YEAR"
                  rm -f "$M5"
                fi
              else
                echo "M5 DOWNLOAD FAILED/SKIPPED $INST $YEAR"
                rm -f "$M5"
              fi
            done
          done

      - name: Join source chunks and verify coverage
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import csv
          instruments = ("usa500idxusd", "usatechidxusd")
          years = range(2016, 2027)
          for inst in instruments:
              for tf in ("h1", "m5"):
                  available = []
                  for year in years:
                      p = Path(f"dl/{inst}_{tf}_{year}.csv")
                      if not p.exists() or p.stat().st_size == 0:
                          if tf == "h1":
                              raise SystemExit(f"Missing H1 chunk: {inst} {year}")
                          continue
                      with p.open(newline="", encoding="utf-8-sig") as f:
                          reader = csv.reader(f)
                          header = next(reader, None)
                          first = next(reader, None)
                      if header and first:
                          available.append((year, p, header))
                  if not available:
                      raise SystemExit(f"No usable {tf.upper()} chunks for {inst}")
                  available_years = {x[0] for x in available}
                  required = set(range(2017, 2026))
                  if tf == "m5" and not required.issubset(available_years):
                      raise SystemExit(f"Missing M5 discovery/forward coverage for {inst}: {sorted(required-available_years)}")
                  header = available[0][2]
                  out = Path(f"dl/{inst}_{tf}.csv")
                  total = 0
                  with out.open("w", newline="", encoding="utf-8") as dst:
                      writer = csv.writer(dst)
                      writer.writerow(header)
                      for year, path, _ in available:
                          with path.open(newline="", encoding="utf-8-sig") as src:
                              reader = csv.reader(src)
                              next(reader, None)
                              count = 0
                              for row in reader:
                                  if row:
                                      writer.writerow(row)
                                      count += 1
                          total += count
                          print(f"JOIN {inst} {tf.upper()} {year}: {count} rows")
                  if total == 0:
                      raise SystemExit(f"Joined {tf.upper()} data empty for {inst}")
                  print(f"COVERAGE {inst} {tf.upper()}: rows={total}; years={sorted(available_years)}")
          PY
          ls -lh dl/usa500idxusd_h1.csv dl/usa500idxusd_m5.csv dl/usatechidxusd_h1.csv dl/usatechidxusd_m5.csv

      - name: Run locked R191 baseline revalidation
        run: |
          python -u research/r193_r191_baseline.py --data-dir dl --out results

      - name: Upload R193 audit outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R193-R191-baseline-audit
          path: results/
          if-no-files-found: warn
          retention-days: 30
