name: R323 FX H1 BID ASK acquisition only

on:
  push:
    branches: ["local-backtest/r189-dukascopy-history"]
    paths:
      - ".github/workflows/r323_fx_currency_data_only.yml"
      - "research/r323_dukascopy_fetch_patch.cjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r323-fx-data-only
  cancel-in-progress: true

jobs:
  acquire:
    name: Download ${{ matrix.pair }} BID/ASK H1 (data only)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        pair: [eurusd, gbpusd, audusd, nzdusd, usdchf, usdcad, usdjpy]
    steps:
      - name: Checkout locked branch
        uses: actions/checkout@v4
        with:
          ref: local-backtest/r189-dukascopy-history

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Download one pair's BID and ASK H1 history
        env:
          NODE_OPTIONS: --require=./research/r323_dukascopy_fetch_patch.cjs
        shell: bash
        run: |
          set -euo pipefail
          PAIR="${{ matrix.pair }}"
          mkdir -p dl/r323 logs/r323
          for side in bid ask; do
            name="$PAIR"_h1_"$side"
            echo "BEGIN_DOWNLOAD=$name"
            set +e
            npx --yes dukascopy-node@1.50.0 \
              -i "$PAIR" -from 2017-01-01 -to 2026-01-01 \
              -t h1 -p "$side" -utc 0 -f csv -fl \
              -dir dl/r323 -fn "$name" \
              -bs 3 -bp 2000 -r 5 -rp 5000 \
              > "logs/r323/$name.log" 2>&1
            rc=$?
            set -e
            if [ "$rc" -ne 0 ] || [ ! -s "dl/r323/$name.csv" ]; then
              echo "DOWNLOAD_FAILED=$name EXIT=$rc"
              tail -n 80 "logs/r323/$name.log" || true
              exit 1
            fi
            echo "DOWNLOAD_OK=$name BYTES=$(wc -c < "dl/r323/$name.csv") ROWS=$(($(wc -l < "dl/r323/$name.csv") - 1))"
          done
      - name: Preserve pair files and logs even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R323-${{ matrix.pair }}-H1-BID-ASK
          path: |
            dl/r323/${{ matrix.pair }}_h1_*.csv
            logs/r323/${{ matrix.pair }}_h1_*.log
          if-no-files-found: warn
          retention-days: 30

  audit:
    name: Combine and audit raw quotes only
    if: always()
    needs: acquire
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout locked branch
        uses: actions/checkout@v4
        with:
          ref: local-backtest/r189-dukascopy-history
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install audit libraries
        run: python -m pip install --upgrade pip numpy pandas
      - name: Combine pair artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: R323-*-H1-BID-ASK
          merge-multiple: true
          path: .
      - name: Compile runner only; audit data without strategy computation
        continue-on-error: true
        run: |
          python -m py_compile research/r323_fx_currency_strength.py
          python -u research/r323_fx_currency_strength.py \
            --audit-only --data-dir dl/r323 --out-dir dl/r323
      - name: Write raw file hash manifest
        if: always()
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path("dl/r323")
          files=sorted(p for p in root.glob("*.csv"))
          manifest={
            "experiment":"R323",
            "mode":"DATA_ACQUISITION_ONLY",
            "raw_csv_count":len(files),
            "raw_files":[{"name":p.name,"bytes":p.stat().st_size,
                          "sha256":hashlib.sha256(p.read_bytes()).hexdigest()} for p in files],
          }
          root.mkdir(parents=True,exist_ok=True)
          (root/"R323_RAW_FILE_MANIFEST.json").write_text(json.dumps(manifest,indent=2,sort_keys=True)+"\n")
          print(json.dumps({"raw_csv_count":len(files),"total_bytes":sum(p.stat().st_size for p in files)},indent=2))
          PY
      - name: Upload combined raw data and audit outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R323-FX-H1-BID-ASK-data
          path: |
            dl/r323/
            logs/r323/
          if-no-files-found: warn
          retention-days: 30
