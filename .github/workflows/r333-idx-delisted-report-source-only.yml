name: R333 official IDX delisted report route probe — source only

on:
  push:
    branches:
      - research/r333-idx-smallcap-daily
    paths:
      - "research/R333_DELISTED_REPORT_REQUEST.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r333-idx-delisted-report-source-only
  cancel-in-progress: false

jobs:
  probe-official-report-route:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout research request and source-only collector
        uses: actions/checkout@v4
        with:
          ref: research/r333-idx-smallcap-daily
          path: research-code
          persist-credentials: false
      - name: Checkout R333 data branch
        uses: actions/checkout@v4
        with:
          ref: data/r333-idx-daily-yahoo
          path: data-repo
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install source-only HTTP dependency
        run: python -m pip install --disable-pip-version-check "requests>=2.32,<3"
      - name: Verify collector syntax
        run: python -m py_compile research-code/research/r333_idx_delisted_report_source_only.py
      - name: Fetch official IDX report routes and referenced JS chunk only
        id: probe
        env:
          R333_DATA_ROOT: ${{ github.workspace }}/data-repo
          R333_REQUEST_PATH: ${{ github.workspace }}/research-code/research/R333_DELISTED_REPORT_REQUEST.json
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: python research-code/research/r333_idx_delisted_report_source_only.py
      - name: Commit raw IDX report routes, frontend chunk, and immutable manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd data-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p data/r333/idx_metadata/delisted_report_probe data/r333/manifests
          git add data/r333/idx_metadata/delisted_report_probe data/r333/manifests/idx-delisted-report-probe-latest.json data/r333/manifests/idx_delisted_report_probe_run_*.json
          if git diff --cached --quiet; then
            echo "No IDX report route artifacts to commit."
            exit 0
          fi
          git commit -m "R333 IDX delisted report route probe run $GITHUB_RUN_ID"
          pushed=0
          for attempt in $(seq 1 5); do
            git fetch origin data/r333-idx-daily-yahoo
            git rebase FETCH_HEAD || { git rebase --abort || true; sleep 2; continue; }
            if git push origin HEAD:data/r333-idx-daily-yahoo; then
              pushed=1
              break
            fi
            sleep 2
          done
          if [ "$pushed" -ne 1 ]; then
            echo "DATA_BRANCH_PUSH_FAILED after 5 attempts" >&2
            exit 1
          fi
      - name: Archive official IDX report route evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R333-IDX-delisted-report-probe-${{ github.run_id }}
          path: |
            data-repo/data/r333/idx_metadata/delisted_report_probe/
            data-repo/data/r333/manifests/idx-delisted-report-probe-latest.json
            data-repo/data/r333/manifests/idx_delisted_report_probe_run_*.json
          if-no-files-found: error
          retention-days: 90
