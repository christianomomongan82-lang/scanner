name: Funded Infrastructure Unit Tests

on:
  push:
    branches:
      - local-backtest/r189-dukascopy-history
    paths:
      - "research/funded_path_adapter.py"
      - "research/test_funded_path_adapter.py"
      - "research/funded_challenge_simulator.py"
      - "research/test_funded_challenge_simulator.py"
      - ".github/workflows/funded-infrastructure-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Adapter and challenge-engine unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: local-backtest/r189-dukascopy-history

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python -m pip install --upgrade pip pandas

      - name: Compile infrastructure modules
        run: python -m py_compile research/funded_path_adapter.py research/funded_challenge_simulator.py

      - name: Run adapter tests
        working-directory: research
        run: python -m unittest -v test_funded_path_adapter.py

      - name: Run challenge-engine tests
        working-directory: research
        run: python -m unittest -v test_funded_challenge_simulator.py
