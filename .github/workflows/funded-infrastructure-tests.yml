name: Funded Infrastructure Unit Tests

on:
  push:
    branches:
      - local-backtest/r189-dukascopy-history
    paths:
      - "research/funded_path_adapter.py"
      - "research/test_funded_path_adapter.py"
      - "research/test_funded_path_adapter_real_data_smoke.py"
      - "research/funded_challenge_simulator.py"
      - "research/test_funded_challenge_simulator.py"
      - "research/replay_funded_challenge_from_ledger.py"
      - "research/test_funded_ledger_normalization.py"
      - ".github/workflows/funded-infrastructure-tests.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  unit-tests:
    name: Adapter and challenge-engine unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: local-backtest/r189-dukascopy-history

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python -m pip install --upgrade pip pandas

      - name: Compile infrastructure modules
        run: python -m py_compile research/funded_path_adapter.py research/funded_challenge_simulator.py research/replay_funded_challenge_from_ledger.py

      - name: Download archived XAUUSD source data (data only)
        uses: actions/download-artifact@v4
        with:
          name: XAUUSD-M5-Dukascopy-BID-ASK-2016-2026
          path: raw
          repository: ${{ github.repository }}
          run-id: 38859918137
          github-token: ${{ github.token }}

      - name: Run adapter tests
        working-directory: research
        run: python -m unittest -v test_funded_path_adapter.py

      - name: Smoke-test adapter against exact archived XAU source
        working-directory: research
        env:
          RAW_DATA_DIR: ${{ github.workspace }}/raw
        run: python -m unittest -v test_funded_path_adapter_real_data_smoke.py

      - name: Run challenge-engine tests
        working-directory: research
        run: python -m unittest -v test_funded_challenge_simulator.py

      - name: Run ledger-normalization tests
        working-directory: research
        run: python -m unittest -v test_funded_ledger_normalization.py
