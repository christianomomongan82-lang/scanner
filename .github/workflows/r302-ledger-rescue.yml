name: R302 one-shot ledger recovery

on:
  push:
    branches:
      - "local-backtest/r189-dukascopy-history"
    paths:
      - ".github/workflows/r302-ledger-rescue.yml"

permissions:
  contents: write
  actions: read

jobs:
  recover-ledgers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: local-backtest/r189-dukascopy-history
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download original raw-data artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r302-raw" "$RUNNER_TEMP/r302-data" "$RUNNER_TEMP/r302-out"
          curl --fail --silent --show-error --location --retry 3 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/12031270051/zip" \
            -o "$RUNNER_TEMP/r302-source.zip"
          unzip -q "$RUNNER_TEMP/r302-source.zip" -d "$RUNNER_TEMP/r302-raw"
          BID="$(find "$RUNNER_TEMP/r302-raw" -type f -name 'xauusd_bid_M5_2016-2026.csv.gz' -print -quit)"
          ASK="$(find "$RUNNER_TEMP/r302-raw" -type f -name 'xauusd_ask_M5_2016-2026.csv.gz' -print -quit)"
          test -n "$BID" && test -n "$ASK"
          cp "$BID" "$RUNNER_TEMP/r302-data/xauusd_bid_M5_2016-2026.csv.gz"
          cp "$ASK" "$RUNNER_TEMP/r302-data/xauusd_ask_M5_2016-2026.csv.gz"
          echo "Original artifact zip bytes: $(stat -c %s "$RUNNER_TEMP/r302-source.zip")"
          sha256sum "$RUNNER_TEMP/r302-source.zip" "$RUNNER_TEMP/r302-data/"*.gz
          test "$(sha256sum "$RUNNER_TEMP/r302-data/xauusd_bid_M5_2016-2026.csv.gz" | cut -d' ' -f1)" = "b30eb4864db0777b6df612f3e43ccda9cc59db5ca09974191eabdaca1f6ff575"
          test "$(sha256sum "$RUNNER_TEMP/r302-data/xauusd_ask_M5_2016-2026.csv.gz" | cut -d' ' -f1)" = "b9b174a83df70507be4ab0cd556432a0d14fbac2e596e787325bd1f163772fc9"

      - name: Rebuild the exact R302 ledger outputs
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check numpy pandas
          python research/r302_xauusd_pm_auction_extension_fade.py \
            --data-dir "$RUNNER_TEMP/r302-data" \
            --out-dir "$RUNNER_TEMP/r302-out"
          cd "$RUNNER_TEMP/r302-out"
          sha256sum R302_primary_cost_trade_ledger.csv R302_preoutcome_eligibility_audit.csv R302_all_cost_delay_streams_and_skips.csv R302_all_valid_trade_ledger.csv
          test "$(sha256sum R302_primary_cost_trade_ledger.csv | cut -d' ' -f1)" = "43d31c21186e679e3e463e092ddbd40cca5a20382c3632d52b5b639314394903"
          test "$(sha256sum R302_preoutcome_eligibility_audit.csv | cut -d' ' -f1)" = "d66a6762f3a59e282078fdf69dd1646d5ad2a930bc6cd92562cd4eb871f3a3a3"
          test "$(sha256sum R302_all_cost_delay_streams_and_skips.csv | cut -d' ' -f1)" = "3dcb874f70c64c3704b311aea4753f2dba9655c8f985f5ab0d7cff370999e683"
          test "$(sha256sum R302_all_valid_trade_ledger.csv | cut -d' ' -f1)" = "d0b2138af8096157e0343fda60d19760b9e7bd34615ce924850f245cbf42d910"
          cd "$GITHUB_WORKSPACE"
          cp "$RUNNER_TEMP/r302-out/R302_primary_cost_trade_ledger.csv" research/
          cp "$RUNNER_TEMP/r302-out/R302_preoutcome_eligibility_audit.csv" research/
          cp "$RUNNER_TEMP/r302-out/R302_all_cost_delay_streams_and_skips.csv" research/
          cp "$RUNNER_TEMP/r302-out/R302_all_valid_trade_ledger.csv" research/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/R302_primary_cost_trade_ledger.csv research/R302_preoutcome_eligibility_audit.csv research/R302_all_cost_delay_streams_and_skips.csv research/R302_all_valid_trade_ledger.csv
          git commit -m "Store checksum-verified R302 detailed ledgers"
          git push origin "HEAD:local-backtest/r189-dukascopy-history"
          echo "Stored all four checksum-verified ledger CSVs in research/."
