name: R272 XAUUSD M5 raw history (data-only retry)

on:
  push:
    branches:
      - data/r272-xauusd-m5-2016-2026
    paths:
      - ".github/workflows/r272-xauusd-data-only-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r272-xauusd-m5-data-only
  cancel-in-progress: false

jobs:
  collect-raw-market-data:
    name: Collect raw XAUUSD M5 BID/ASK only
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout acquisition code
        uses: actions/checkout@v4
        with:
          ref: data/r272-xauusd-m5-2016-2026
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate data collector syntax
        run: python -m py_compile research/download_xauusd_m5_2016_2026.py
      - name: Download raw XAUUSD M5 BID/ASK
        env:
          DUKASCOPY_NODE_VERSION: "1.50.0"
        run: python -u research/download_xauusd_m5_2016_2026.py
      - name: Upload raw market data only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XAUUSD-M5-Dukascopy-BID-ASK-2016-2026
          path: data_exports/xauusd_m5_2016_2026/
          if-no-files-found: warn
          retention-days: 90
