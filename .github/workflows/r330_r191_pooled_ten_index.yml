                BS=3; BP=2000; RP=5000
              else
                BS=10; BP=1000; RP=1000
              fi
              MAX_ATTEMPTS=3
              if [ "$YEAR" -le 2018 ]; then MAX_ATTEMPTS=1; fi
              OK=false
              for ATTEMPT in $(seq 1 "$MAX_ATTEMPTS"); do
                rm -f "$RAW"
                echo "DOWNLOAD $BASE: $FROM to $TO (attempt $ATTEMPT/$MAX_ATTEMPTS)"
                DOWNLOAD_OK=false
                if [ "$TF" = "h1" ]; then
                  if npx --yes dukascopy-node@1.50.0 \
                    -i "$INST" -from "$FROM" -to "$TO" \
                    -t h1 -p bid -utc 0 -f csv -fl \
                    -dir dl/chunks -fn "$BASE" \
                    -bs "$BS" -bp "$BP" -r 5 -re -rp "$RP"; then
                    DOWNLOAD_OK=true
                  fi
                else
                  if npx --yes dukascopy-node@1.50.0 \
                    -i "$INST" -from "$FROM" -to "$TO" \
                    -t m5 -p bid -utc 0 -f csv -fl \
                    -dir dl/chunks -fn "$BASE" \
                    -bs "$BS" -bp "$BP" -r 5 -rp "$RP"; then
                    DOWNLOAD_OK=true
                  fi
                fi

                if [ "$DOWNLOAD_OK" = "true" ]; then
