              BASE="${INST}_${TF}_${YEAR}"
              CHUNK="dl/chunks/${BASE}.csv.gz"
              RAW="dl/chunks/${BASE}.csv"
              if [ -s "$CHUNK" ] && gzip -t "$CHUNK" >/dev/null 2>&1; then
