            dl/${{ matrix.instrument }}_m5.csv.gz
          if-no-files-found: error
          retention-days: 7

  backtest:
    needs: [prepare-instrument]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Download all ten instrument snapshots
        uses: actions/download-artifact@v4
        with:
          pattern: r330-asset-*
          path: dl
          merge-multiple: true
      - name: Install Python and compile
        run: |
          python -m pip install --upgrade pip pandas numpy requests
          python -m py_compile research/r192_ger40.py research/r194_ten_index.py research/R191_CANONICAL_index_trend_long.py research/r330_r191_pooled_ten_index.py
      - name: Validate snapshots and run locked R330 pooled baseline
        run: |
          python - <<'PY'
          from pathlib import Path
          from research.r192_ger40 import parse_data
          assets = ("usa500idxusd","usatechidxusd","usa30idxusd","ussc2000idxusd","deuidxeur","gbridxgbp","fraidxeur","eusidxeur","ausidxaud","jpnidxjpy")
          missing = []
          for inst in assets:
              for tf in ("m5",):
                  p = Path("dl") / f"{inst}_{tf}.csv.gz"
                  try:
                      bars, duplicates = parse_data(p)
                      print(f"COVERAGE {inst} {tf.upper()}: rows={len(bars):,}; duplicates_removed={duplicates}; UTC={bars.index[0].tz_convert('UTC').isoformat()}..{bars.index[-1].tz_convert('UTC').isoformat()}")
                  except Exception as exc:
                      missing.append(f"{inst} {tf}: {type(exc).__name__}: {exc}")
          if missing:
              raise SystemExit("Incomplete snapshots:\n" + "\n".join(missing))
          print("PASS: all ten H1/M5 snapshot pairs validate.")
          PY
          python -u research/r330_r191_pooled_ten_index.py --data-dir dl --out research
      - name: Upload R330 research results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R330-research-results
          path: research/R330_*
          if-no-files-found: warn
          retention-days: 90

      - name: Commit R330 results and project checkpoint
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Record R330 locked verdict and research outputs"
          branch: ${{ github.ref_name }}
          file_pattern: 'PROJECT_STATE.md research/R330_*'
