name: R334 Dukascopy FX quote acquisition v3 — checkpointed

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/r334_fx_market_quotes_v3.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: r334-dukascopy-fx-quotes-v3
  cancel-in-progress: false

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout persistent data branch
        uses: actions/checkout@v4
        with:
          ref: data/r334-fx-market-quotes
          fetch-depth: 0

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Download exactly one pending annual segment and checkpoint it
        id: acquire
        env:
          NODE_OPTIONS: --require=./dukascopy_fetch_patch.cjs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p raw/r334/parts raw/r334/logs raw/r334/status
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          SYMBOLS=(usdhuf eurnok usdzar eurusd)
          SIDES=(bid ask)
          found=0

          for symbol in "${SYMBOLS[@]}"; do
            for side in "${SIDES[@]}"; do
              for year in $(seq 2007 2026); do
                from="${year}-01-01"
                to="$((year + 1))-01-01"
                if [ "$year" -eq 2007 ]; then from="2007-03-13"; fi
                if [ "$year" -eq 2026 ]; then to="2026-11-01"; fi

                name="${symbol}_m5_${side}_${year}"
                csv="raw/r334/parts/${name}.csv"
                part="raw/r334/parts/${name}.csv.gz"
                status_file="raw/r334/status/${name}.json"

                if [ -s "$status_file" ]; then
                  state=$(python -c 'import json,sys; print(json.load(open(sys.argv[1])).get("status",""))' "$status_file")
                  if [ "$state" = "DATA_WITH_POSSIBLE_GAPS" ] || [ "$state" = "EXHAUSTED_NO_DATA" ]; then
                    continue
                  fi
                  attempts=$(python -c 'import json,sys; print(json.load(open(sys.argv[1])).get("attempts",0))' "$status_file")
                else
                  attempts=0
                fi
                attempts=$((attempts + 1))

                log="raw/r334/logs/${name}.attempt${attempts}.log"
                echo "ACQUIRE_START symbol=$symbol side=$side year=$year attempt=$attempts from=$from to_exclusive=$to"
                set +e
                npx --yes dukascopy-node@1.50.0 \
                  -i "$symbol" -from "$from" -to "$to" \
                  -t m5 -p "$side" -utc 0 -f csv \
                  -dir raw/r334/parts -fn "$name" \
                  -bs 1 -bp 4000 -r 10 -re -fr -rp 10000 \
                  --rate-limit-retries 5 \
                  2>&1 | tee "$log"
                rc=${PIPESTATUS[0]}
                set -e

                rows=0
                raw_sha=""
                raw_bytes=0
                if [ -s "$csv" ]; then
                  rows=$(($(wc -l < "$csv") - 1))
                  raw_bytes=$(wc -c < "$csv")
                  raw_sha=$(sha256sum "$csv" | awk '{print $1}')
                fi

                if [ "$rows" -gt 0 ]; then
                  gzip -n -c "$csv" > "$part"
                  rm -f "$csv"
                  state="DATA_WITH_POSSIBLE_GAPS"
                elif [ "$attempts" -ge 3 ]; then
                  state="EXHAUSTED_NO_DATA"
                  rm -f "$csv"
                else
                  state="NO_DATA_RETRY"
                  rm -f "$csv"
                fi

                gzip -n "$log"
                LOG_GZ="${log}.gz" \
                PART="$part" \
                STATUS_FILE="$status_file" \
                SYMBOL="$symbol" SIDE="$side" YEAR="$year" \
                REQUEST_FROM="$from" REQUEST_TO="$to" \
                STATE="$state" ATTEMPTS="$attempts" RC="$rc" \
                ROWS="$rows" RAW_BYTES="$raw_bytes" RAW_SHA="$raw_sha" \
                python - <<'PY'
          import json, os
          from pathlib import Path
          record = {
              "symbol": os.environ["SYMBOL"],
              "side": os.environ["SIDE"],
              "timeframe": "m5",
              "year": int(os.environ["YEAR"]),
              "requested_from_utc_inclusive": os.environ["REQUEST_FROM"] + "T00:00:00Z",
              "requested_to_utc_exclusive": os.environ["REQUEST_TO"] + "T00:00:00Z",
              "status": os.environ["STATE"],
              "attempts": int(os.environ["ATTEMPTS"]),
              "downloader_exit_code": int(os.environ["RC"]),
              "rows_excluding_header": int(os.environ["ROWS"]),
              "raw_csv_bytes": int(os.environ["RAW_BYTES"]),
              "raw_csv_sha256": os.environ["RAW_SHA"] or None,
              "saved_part": os.environ["PART"] if os.environ["STATE"] == "DATA_WITH_POSSIBLE_GAPS" else None,
              "log_gzip": os.environ["LOG_GZ"],
              "utc_offset_minutes": 0,
              "synthetic_flats": False,
              "recorded_by": "R334 checkpointed raw acquisition v3"
          }
          Path(os.environ["STATUS_FILE"]).write_text(json.dumps(record, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(record))
          PY

                git add "$status_file" "${log}.gz"
                if [ -s "$part" ]; then git add "$part"; fi
                git commit -m "R334 checkpoint: ${symbol} ${side} M5 ${year} (attempt ${attempts})"
                git push origin HEAD:data/r334-fx-market-quotes

                echo "CHECKPOINT_SAVED symbol=$symbol side=$side year=$year state=$state rows=$rows rc=$rc"
                found=1
                break 3
              done
            done
          done

          remaining=$(python - <<'PY'
          import json
          from pathlib import Path
          symbols = ["usdhuf", "eurnok", "usdzar", "eurusd"]
          sides = ["bid", "ask"]
          pending = 0
          for symbol in symbols:
              for side in sides:
                  for year in range(2007, 2027):
                      p = Path(f"raw/r334/status/{symbol}_m5_{side}_{year}.json")
                      if not p.is_file():
                          pending += 1
                          continue
                      try:
                          state = json.loads(p.read_text()).get("status")
                      except Exception:
                          state = None
                      if state not in {"DATA_WITH_POSSIBLE_GAPS", "EXHAUSTED_NO_DATA"}:
                          pending += 1
          print(pending)
          PY
          )

          echo "pending=$remaining"
          if [ "$remaining" -eq 0 ]; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
            echo "All 160 annual segments have a terminal status."
          else
            echo "complete=false" >> "$GITHUB_OUTPUT"
            echo "Checkpoint complete; pending annual segments=$remaining."
          fi

      - name: Combine checkpointed raw parts and write final acquisition manifest
        if: steps.acquire.outputs.complete == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, gzip, hashlib, json
          from pathlib import Path

          root = Path("raw/r334")
          parts = root / "parts"
          status_dir = root / "status"
          symbols = ["usdhuf", "eurnok", "usdzar", "eurusd"]
          sides = ["bid", "ask"]
          expected_header = ["timestamp", "open", "high", "low", "close"]
          annual = []
          combined = []

          for symbol in symbols:
              for side in sides:
                  out = root / f"{symbol}_m5_{side}_2007-03-13_2026-11-01.csv"
                  out_rows = 0
                  out_first = out_last = None

                  with out.open("w", newline="", encoding="utf-8") as dst:
                      writer = csv.writer(dst)
                      writer.writerow(expected_header)

                      for year in range(2007, 2027):
                          status_path = status_dir / f"{symbol}_m5_{side}_{year}.json"
                          part = parts / f"{symbol}_m5_{side}_{year}.csv.gz"
                          record = json.loads(status_path.read_text()) if status_path.exists() else {
                              "symbol": symbol, "side": side, "year": year, "status": "MISSING_STATUS"
                          }
                          record["part_file"] = str(part) if part.exists() else None

                          if part.is_file():
                              digest = hashlib.sha256(part.read_bytes()).hexdigest()
                              record["compressed_part_sha256"] = digest
                              with gzip.open(part, "rt", newline="", encoding="utf-8-sig") as src:
                                  reader = csv.reader(src)
                                  header = next(reader, None)
                                  if header != expected_header:
                                      record["merge_status"] = "INVALID_HEADER"
                                  else:
                                      rows = [row for row in reader if row]
                                      record["merge_status"] = "DATA"
                                      record["merged_rows"] = len(rows)
                                      if rows:
                                          writer.writerows(rows)
                                          out_rows += len(rows)
                                          if out_first is None:
                                              out_first = rows[0][0]
                                          out_last = rows[-1][0]
                          else:
                              record["merge_status"] = "NO_DATA_FILE"
                              record["merged_rows"] = 0

                          annual.append(record)

                  if out_rows:
                      digest = hashlib.sha256(out.read_bytes()).hexdigest()
                      combined.append({
                          "symbol": symbol, "side": side, "timeframe": "m5",
                          "rows_excluding_header": out_rows,
                          "actual_first_timestamp_raw": out_first,
                          "actual_last_timestamp_raw": out_last,
                          "bytes": out.stat().st_size,
                          "sha256": digest,
                          "file": str(out),
                          "status": "DATA_WITH_GAPS_POSSIBLE"
                      })
                  else:
                      out.unlink(missing_ok=True)

          manifest = {
              "experiment": "R334",
              "purpose": "raw historical quote acquisition only; no signals, descriptive statistics, returns, PnL, or strategy verdict calculations",
              "provider": "Dukascopy via dukascopy-node",
              "downloader_version": "1.50.0",
              "timezone": "UTC",
              "utc_offset_minutes": 0,
              "timeframe": "m5",
              "include_synthetic_flats": False,
              "empty_response_handling": "retryOnEmpty=true; failAfterRetryCount=false; all annual attempt logs retained",
              "requested_common_window": {
                  "from_inclusive": "2007-03-13T00:00:00Z",
                  "to_exclusive": "2026-11-01T00:00:00Z"
              },
              "symbols": symbols,
              "combined_files": combined,
              "annual_status": annual
          }
          (root / "R334_ACQUISITION_MANIFEST.json").write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          print(f"MANIFEST annual_records={len(annual)} combined_files={len(combined)}")
          for item in annual:
              print(f"ANNUAL {item.get('symbol')} {item.get('side')} {item.get('year')} status={item.get('status')} rows={item.get('rows_excluding_header',0)} merge={item.get('merge_status')}")
          PY

          git add raw/r334/R334_ACQUISITION_MANIFEST.json
          git commit -m "R334: finalize raw M5 acquisition manifest"
          git push origin HEAD:data/r334-fx-market-quotes

      - name: Upload merged raw quotes and full provenance
        if: steps.acquire.outputs.complete == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: R334-Dukascopy-M5-BID-ASK-2007-2026-v3
          path: |
            raw/r334/*.csv
            raw/r334/R334_ACQUISITION_MANIFEST.json
            raw/r334/logs/*.gz
            raw/r334/status/*.json
          if-no-files-found: error
          retention-days: 90

      - name: Dispatch next checkpointed run
        if: steps.acquire.outputs.complete != 'true'
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/r334_fx_market_quotes_v3.yml/dispatches" \
            -f ref=main
          echo "Next checkpointed acquisition run queued."
