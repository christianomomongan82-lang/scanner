name: R192 GER40 Research

on:
  push:
    branches: [main]
    paths:
      - "research/r192_ger40.py"
      - ".github/workflows/r192_ger40_research.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r192-ger40-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy

      - name: Prepare output directories
        run: mkdir -p dl results

      - name: Download GER40 H1 BID history for R191-compatible signal bars
        env:
          NODE_OPTIONS: --require=./dukascopy_fetch_patch.cjs
        run: |
          npx --yes dukascopy-node \
            -i deuidxeur \
            -from 2016-01-01 \
            -to now \
            -t h1 \
            -p bid \
            -utc 0 \
            -f csv \
            -fl \
            -dir dl \
            -fn r192_ger40_h1 \
            -bs 3 \
            -bp 2000 \
            -r 5 \
            -re \
            -rp 5000
          test -s dl/r192_ger40_h1.csv
          echo "Downloaded GER40 H1 BID:"
          ls -lh dl/r192_ger40_h1.csv
          head -n 2 dl/r192_ger40_h1.csv

      - name: Download GER40 M5 BID history for delayed execution and exits
        env:
          NODE_OPTIONS: --require=./dukascopy_fetch_patch.cjs
        run: |
          npx --yes dukascopy-node \
            -i deuidxeur \
            -from 2016-01-01 \
            -to now \
            -t m5 \
            -p bid \
            -utc 0 \
            -f csv \
            -fl \
            -dir dl \
            -fn r192_ger40_m5 \
            -bs 3 \
            -bp 2000 \
            -r 5 \
            -re \
            -rp 5000
          test -s dl/r192_ger40_m5.csv
          echo "Downloaded GER40 M5 BID:"
          ls -lh dl/r192_ger40_m5.csv
          head -n 2 dl/r192_ger40_m5.csv

      - name: Run locked research
        run: python -u research/r192_ger40.py --h1-csv dl/r192_ger40_h1.csv --m5-csv dl/r192_ger40_m5.csv --out results

      - name: Upload audit outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R192-GER40-audit
          path: results/
          if-no-files-found: warn
          retention-days: 30
