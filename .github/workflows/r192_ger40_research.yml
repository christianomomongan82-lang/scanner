name: R192 GER40 Research

on:
  push:
    branches: [main]
    paths:
      - "research/r192_ger40.py"
      - ".github/workflows/r192_ger40_research.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r192-ger40-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy

      - name: Prepare output directories
        run: mkdir -p dl results

      - name: Download and join annual GER40 H1 BID chunks
        env:
          NODE_OPTIONS: --require=./dukascopy_fetch_patch.cjs
        shell: bash
        run: |
          set -euo pipefail
          for YEAR in $(seq 2016 2026); do
            NEXT=$((YEAR + 1))
            FROM="${YEAR}-01-01"
            if [ "$YEAR" -eq 2026 ]; then TO="now"; else TO="${NEXT}-01-01"; fi
            FILE="dl/ger40_h1_${YEAR}.csv"
            echo "H1 download ${YEAR}: ${YEAR}-01-01 to $TO"
            rm -f "$FILE"
            npx --yes dukascopy-node \
              -i deuidxeur -from "$FROM" -to "$TO" \
              -t h1 -p bid -utc 0 -f csv -fl \
              -dir dl -fn "ger40_h1_${YEAR}" \
              -bs 3 -bp 2000 -r 5 -re -rp 5000
            test -s "$FILE"
            echo "H1 chunk rows: $(($(wc -l < "$FILE") - 1))"
          done
          head -n 1 dl/ger40_h1_2016.csv > dl/r192_ger40_h1.csv
          for YEAR in $(seq 2016 2026); do
            tail -n +2 "dl/ger40_h1_${YEAR}.csv" >> dl/r192_ger40_h1.csv
          done
          test -s dl/r192_ger40_h1.csv
          ls -lh dl/r192_ger40_h1.csv
          head -n 2 dl/r192_ger40_h1.csv

      - name: Download and join annual GER40 M5 BID chunks
        env:
          NODE_OPTIONS: --require=./dukascopy_fetch_patch.cjs
        shell: bash
        run: |
          set -euo pipefail
          for YEAR in $(seq 2016 2026); do
            NEXT=$((YEAR + 1))
            FROM="${YEAR}-01-01"
            if [ "$YEAR" -eq 2026 ]; then TO="now"; else TO="${NEXT}-01-01"; fi
            FILE="dl/ger40_m5_${YEAR}.csv"
            echo "M5 download ${YEAR}: ${YEAR}-01-01 to $TO"
            rm -f "$FILE"
            npx --yes dukascopy-node \
              -i deuidxeur -from "$FROM" -to "$TO" \
              -t m5 -p bid -utc 0 -f csv -fl \
              -dir dl -fn "ger40_m5_${YEAR}" \
              -bs 3 -bp 2000 -r 5 -re -rp 5000
            test -s "$FILE"
            echo "M5 chunk rows: $(($(wc -l < "$FILE") - 1))"
          done
          head -n 1 dl/ger40_m5_2016.csv > dl/r192_ger40_m5.csv
          for YEAR in $(seq 2016 2026); do
            tail -n +2 "dl/ger40_m5_${YEAR}.csv" >> dl/r192_ger40_m5.csv
          done
          test -s dl/r192_ger40_m5.csv
          ls -lh dl/r192_ger40_m5.csv
          head -n 2 dl/r192_ger40_m5.csv

      - name: Run locked research
        run: python -u research/r192_ger40.py --h1-csv dl/r192_ger40_h1.csv --m5-csv dl/r192_ger40_m5.csv --out results

      - name: Upload audit outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R192-GER40-audit
          path: results/
          if-no-files-found: warn
          retention-days: 30
