name: R192 GER40 Research

on:
  push:
    branches: [main]
    paths:
      - "research/r192_ger40.py"
      - ".github/workflows/r192_ger40_research.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r192-ger40-research-chunked
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy requests

      - name: Prepare output directories
        run: mkdir -p dl results

      - name: Compile runner and preflight Dukascopy weekend handling
        env:
          NODE_OPTIONS: --require=./dukascopy_fetch_patch.cjs
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scan.py research/r192_ger40.py
          echo "Preflight R191/R192 H4 wall-clock and DST parity"
          python - <<'PY'
          import numpy as np
          import pandas as pd
          import scan
          from research.r192_ger40 import build_h4
          spans = [
              pd.date_range("2025-03-07", "2025-03-12", freq="h", tz="UTC"),
              pd.date_range("2025-10-31", "2025-11-05", freq="h", tz="UTC"),
          ]
          idx = spans[0].append(spans[1]).unique().sort_values()
          values = np.arange(len(idx), dtype=float) + 10000.0
          h1 = pd.DataFrame({
              "open": values,
              "high": values + 1.0,
              "low": values - 1.0,
              "close": values + 0.25,
          }, index=idx)
          live_h4 = scan.to_h4(h1)
          research_h4, diag = build_h4(h1, pd.Timestamp("2026-01-01", tz="UTC"))
          if not live_h4.index.equals(research_h4.index):
              raise SystemExit("FAIL: R191/R192 H4 indexes differ")
          for col in ("open", "high", "low", "close"):
              if not np.allclose(live_h4[col].to_numpy(), research_h4[col].to_numpy()):
                  raise SystemExit(f"FAIL: R191/R192 OHLC differs: {col}")
          hours = set(live_h4.index.hour)
          if not hours.issubset({1, 5, 9, 13, 17, 21}):
              raise SystemExit(f"FAIL: local H4 boundary hour unexpected: {sorted(hours)}")
          spring = live_h4.loc[(live_h4.index.strftime("%Y-%m-%d") == "2025-03-09") & (live_h4.index.hour == 1)]
          fall = live_h4.loc[(live_h4.index.strftime("%Y-%m-%d") == "2025-11-02") & (live_h4.index.hour == 1)]
          if len(spring) != 1 or float((spring["bar_close_utc"].iloc[0] - spring.index[0].tz_convert("UTC")) / pd.Timedelta(hours=1)) != 3.0:
              raise SystemExit("FAIL: spring DST 01->05 interval is not 3 elapsed hours")
          if len(fall) != 1 or float((fall["bar_close_utc"].iloc[0] - fall.index[0].tz_convert("UTC")) / pd.Timedelta(hours=1)) != 5.0:
              raise SystemExit("FAIL: autumn DST 01->05 interval is not 5 elapsed hours")
          print("PASS: R191 and R192 have identical OHLC/index; local labels stay 01/05/09/13/17/21.")
          print("PASS: DST transition intervals are 3h in spring and 5h in autumn; source bars are not forward-filled.")
          print("DST diagnostic:", diag["h4_elapsed_duration_hours_counts"])
          PY
          echo "Preflight H1 (weekday range)"
          npx --yes dukascopy-node \
            -i deuidxeur -from 2025-01-06 -to 2025-01-08 \
            -t h1 -p bid -utc 0 -f csv -fl \
            -dir dl -fn smoke_h1 \
            -bs 10 -bp 1000 -r 5 -rp 1000
          test -s dl/smoke_h1.csv
          head -n 2 dl/smoke_h1.csv
          echo "Preflight M5 across weekend (empty daily responses must not abort)"
          npx --yes dukascopy-node \
            -i deuidxeur -from 2025-01-03 -to 2025-01-08 \
            -t m5 -p bid -utc 0 -f csv -fl \
            -dir dl -fn smoke_m5_weekend \
            -bs 10 -bp 1000 -r 5 -rp 1000
          test -s dl/smoke_m5_weekend.csv
          head -n 2 dl/smoke_m5_weekend.csv

      - name: Download and join annual GER40 H1 BID chunks
        env:
          NODE_OPTIONS: --require=./dukascopy_fetch_patch.cjs
        shell: bash
        run: |
          set -euo pipefail
          for YEAR in $(seq 2016 2026); do
            NEXT=$((YEAR + 1))
            FROM="${YEAR}-01-01"
            if [ "$YEAR" -eq 2026 ]; then TO="now"; else TO="${NEXT}-01-01"; fi
            FILE="dl/ger40_h1_${YEAR}.csv"
            echo "H1 download ${YEAR}: ${YEAR}-01-01 to $TO"
            rm -f "$FILE"
            npx --yes dukascopy-node \
              -i deuidxeur -from "$FROM" -to "$TO" \
              -t h1 -p bid -utc 0 -f csv -fl \
              -dir dl -fn "ger40_h1_${YEAR}" \
              -bs 3 -bp 2000 -r 5 -re -rp 5000
            test -s "$FILE"
            echo "H1 chunk rows: $(($(wc -l < "$FILE") - 1))"
          done
          head -n 1 dl/ger40_h1_2016.csv > dl/r192_ger40_h1.csv
          for YEAR in $(seq 2016 2026); do
            tail -n +2 "dl/ger40_h1_${YEAR}.csv" >> dl/r192_ger40_h1.csv
          done
          test -s dl/r192_ger40_h1.csv
          ls -lh dl/r192_ger40_h1.csv
          head -n 2 dl/r192_ger40_h1.csv

      - name: Download and join annual GER40 M5 BID chunks (skip unavailable years, record coverage)
        env:
          NODE_OPTIONS: --require=./dukascopy_fetch_patch.cjs
        shell: bash
        run: |
          set -uo pipefail
          : > dl/m5_coverage.txt
          for YEAR in $(seq 2016 2026); do
            NEXT=$((YEAR + 1))
            FROM="${YEAR}-01-01"
            if [ "$YEAR" -eq 2026 ]; then TO="now"; else TO="${NEXT}-01-01"; fi
            FILE="dl/ger40_m5_${YEAR}.csv"
            echo "M5 download ${YEAR}: ${YEAR}-01-01 to $TO"
            rm -f "$FILE"
            if npx --yes dukascopy-node \
              -i deuidxeur -from "$FROM" -to "$TO" \
              -t m5 -p bid -utc 0 -f csv -fl \
              -dir dl -fn "ger40_m5_${YEAR}" \
              -bs 10 -bp 1000 -r 5 -rp 1000; then
              if [ -s "$FILE" ] && [ "$(wc -l < "$FILE")" -gt 1 ]; then
                ROWS=$(($(wc -l < "$FILE") - 1))
                echo "${YEAR},AVAILABLE,${ROWS}" | tee -a dl/m5_coverage.txt
              else
                echo "${YEAR},EMPTY_OR_HEADER_ONLY,0" | tee -a dl/m5_coverage.txt
                rm -f "$FILE"
              fi
            else
              echo "${YEAR},DOWNLOAD_FAILED_OR_NO_DATA,0" | tee -a dl/m5_coverage.txt
              rm -f "$FILE"
            fi
          done
          python - <<'PY'
          from pathlib import Path
          import csv
          years = list(range(2016, 2027))
          available = []
          for year in years:
              p = Path(f"dl/ger40_m5_{year}.csv")
              if p.exists() and p.stat().st_size:
                  with p.open(newline="", encoding="utf-8-sig") as f:
                      rows = csv.reader(f)
                      header = next(rows, None)
                      first = next(rows, None)
                  if header and first:
                      available.append((year, p, header))
          if not available:
              raise SystemExit("No usable GER40 M5 data returned for any year; research aborted.")
          header = available[0][2]
          out = Path("dl/r192_ger40_m5.csv")
          total = 0
          with out.open("w", newline="", encoding="utf-8") as dst:
              writer = csv.writer(dst)
              writer.writerow(header)
              for year, path, _ in available:
                  with path.open(newline="", encoding="utf-8-sig") as src:
                      reader = csv.reader(src)
                      next(reader, None)
                      count = 0
                      for row in reader:
                          if row:
                              writer.writerow(row)
                              count += 1
                  total += count
                  print(f"M5_JOIN year={year} rows={count}")
          print(f"M5_JOIN total_rows={total} available_years={[x[0] for x in available]}")
          if total == 0:
              raise SystemExit("Joined M5 file has no data rows.")
          PY
          echo "M5 coverage diagnostics:"
          cat dl/m5_coverage.txt
          ls -lh dl/r192_ger40_m5.csv
          head -n 2 dl/r192_ger40_m5.csv
          grep -E '^(2022|2023|2024|2025),AVAILABLE,' dl/m5_coverage.txt >/dev/null || {
            echo "ERROR: At least one forward year (2022-2025) lacks usable M5 data."
            exit 1
          }

      - name: Run locked research
        run: python -u research/r192_ger40.py --h1-csv dl/r192_ger40_h1.csv --m5-csv dl/r192_ger40_m5.csv --out results

      - name: Upload audit outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R192-GER40-audit
          path: results/
          if-no-files-found: warn
          retention-days: 30
