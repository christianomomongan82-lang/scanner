name: R251 FX cross-pair lead-lag

on:
  push:
    branches:
      - r251-fx-cross-pair-lead-lag
    paths:
      - "research/r251_fx_cross_pair.py"
      - "!research/R251_fx_cross_pair_results.json"
      - "!research/R251_fx_cross_pair_trades.csv"
      - "!research/R251_fx_cross_pair_annual.csv"

permissions:
  contents: write

concurrency:
  group: r251-fx-cross-pair-lead-lag
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout isolated experiment branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Restore cached R251 H1 quotes
        uses: actions/cache/restore@v4
        with:
          path: dl/r251_fx
          key: ${{ runner.os }}-r251-fx-h1-history-v1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python libraries
        run: python -m pip install --upgrade pip pandas numpy
      - name: Compile strategy script
        run: python -m py_compile research/r251_fx_cross_pair.py
      - name: Download quotes and run frozen R251 test
        id: backtest
        continue-on-error: true
        run: python -u research/r251_fx_cross_pair.py
      - name: Save cached R251 H1 quotes
        if: always()
        uses: actions/cache/save@v4
        with:
          path: dl/r251_fx
          key: ${{ runner.os }}-r251-fx-h1-history-v1
      - name: Upload R251 source quote files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r251-source-h1-quotes
          path: dl/r251_fx/*_H1.csv
          if-no-files-found: ignore
          retention-days: 7
      - name: Commit R251 outputs
        if: always()
        run: |
          if [ ! -f research/R251_fx_cross_pair_results.json ]; then
            printf '{"status":"FAILED_RUN","verdict":"GAGAL","error":"Script failed before producing result JSON"}\n' > research/R251_fx_cross_pair_results.json
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f research/R251_fx_cross_pair_results.json
          for file in research/R251_fx_cross_pair_trades.csv research/R251_fx_cross_pair_annual.csv; do
            if [ -f "$file" ]; then git add -f "$file"; fi
          done
          if git diff --cached --quiet; then
            echo "No output changes to commit."
          else
            git commit -m "[skip ci] R251 FX cross-pair backtest results"
            git push origin HEAD:r251-fx-cross-pair-lead-lag
          fi
      - name: Fail workflow if test failed
        if: steps.backtest.outcome == 'failure'
        run: exit 1
